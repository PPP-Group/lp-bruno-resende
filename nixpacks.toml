# ============================================================================
# NIXPACKS
# ----------------------------------------------------------------------------
# O Nixpacks acha `puppeteer-core` em devDependencies -- usado só pelos
# scripts de prova em scripts/ (provar.mjs, shots.mjs, barra.mjs), rodados na
# máquina de quem desenvolve, nunca no deploy -- e por padrão instala o
# Chromium do sistema para viabilizá-lo.
#
# No Ubuntu 24.04 esse pacote é um invólucro para snap, e o snap precisa do
# systemd rodando como PID 1 para configurar o pacote. Um build Docker não
# tem isso: o passo trava ou falha, arrastando consigo cerca de 150 pacotes e
# 500 MB (snapd, apparmor, o próprio systemd) que um site estático servido
# por Caddy nunca usa.
#
# Esta seção substitui só a fase de setup, com nodejs e npm e nada mais. As
# demais fases (install, build, a que serve o Caddy) continuam como o
# Nixpacks/Easypanel já detectam sozinhos -- nixpacks.toml só sobrescreve as
# fases que ele lista.
#
# nodejs_18: o Nixpacks detectava esse valor sozinho antes desta sobrescrita
# (não há engines em package.json), e a primeira versão deste arquivo copiou
# o mesmo número sem checar se ainda servia. Não serve: @tailwindcss/oxide
# exige Node >= 20 e sharp exige >= 20.9 para o binário nativo delas, e sem
# a versão certa `npm ci` instala mas o binário não carrega -- falha só na
# hora do build, não na instalação. nodejs_22 cobre as duas com folga.
# ============================================================================

[phases.setup]
nixPkgs = ["nodejs_22", "npm-9_x"]
aptPkgs = []
